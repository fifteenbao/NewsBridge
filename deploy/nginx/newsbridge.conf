# Included in nginx's http context through sites-enabled on Ubuntu.
limit_req_zone $binary_remote_addr zone=newsbridge_api:10m rate=5r/s;
server {
    listen 80;
    server_name newsbridge.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name newsbridge.example.com;
    ssl_certificate /etc/letsencrypt/live/newsbridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsbridge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 20m;
    client_body_timeout 15s;

    location /v1/ {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=newsbridge_api burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host newsbridge.example.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 180s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
    }
    location / { return 404; }
}
